version: 1
sources:
  - name: personal
    type: local
    path: ~/.skill-sync/skills
skills:
  - blog
  - code
  - docs
  - skill-sync
  - test
  - todo
  - tidy-perms
  - SHARED/change-framework
  - SHARED/investigation-framework
  - SHARED/review-protocol
targets:
  claude:
    dir: .claude/skills
    tracked: true
  codex:
    dir: .codex/skills
    tracked: true
  gemini:
    dir: .gemini/skills
    tracked: true
install_mode: mirror
config:
  code:
    review_checklist: "When a TODO says a SQL-translation fix is done because a test harness passed, check the helper call site. Confirm the test uses the same read= value as the wrapper. One dialect passing does not prove all dialects work with SQLGlot."
projects:
  - ~/Developer/letterops-mcp
