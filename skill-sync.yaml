version: 1
sources:
  - name: personal
    type: local
    path: ~/.skill-sync/skills
skills:
  - blog
  - code
  - docs
  - skill-sync
  - test
  - todo
  - tidy-perms
  - SHARED/change-framework
  - SHARED/investigation-framework
  - SHARED/review-protocol
targets:
  claude:
    dir: .claude/skills
    tracked: true
  codex:
    dir: .codex/skills
    tracked: true
  gemini:
    dir: .gemini/skills
    tracked: true
install_mode: mirror
config:
  code:
    review_checklist: "For TODOs claiming to retire a SQL-translation post-fixup from a harness PASS, grep the helper call site and confirm the harness probe matches the wrapper's read= argument. A single-dialect PASS cannot retire a helper invoked with SQLGlot cross-dialect translation."
projects:
  - ~/Developer/letterops-mcp
