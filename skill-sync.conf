# skill-sync's own skills. See README.md for the format.
#
# The catalog is a local checkout: skill-sync never fetches. Point `source` at
# wherever https://github.com/joeharris76/skill-sync-skills.git is cloned.

target = .claude/skills
target = .agents/skills

source = ~/Developer/skill-sync-skills
rev    = 6580679cca642e704725ce43a20316aa2ff634f2
dir    = skills
skill  = blog
skill  = bossmode
skill  = code
skill  = docs
skill  = shared-change-framework
skill  = shared-investigation-framework
skill  = shared-review-protocol
skill  = test
skill  = tidy-perms
skill  = todo

# This repository owns the skill-sync operator skill. `rev = HEAD` copies the
# last committed version, so an edit lands one commit after it is made.
source = .
rev    = HEAD
dir    = skills
skill  = skill-sync
